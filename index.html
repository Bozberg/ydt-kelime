<head>

<title>YDT Kelime Antrenmanı</title>

<meta name="apple-mobile-web-app-title" content="YDT Kelime">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#15123a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Zilla+Slab:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Düzen fikri: telefon öncelikli tek sütun; üstte puan, ortada avatar ve çalışma kartı; kelime fosforlu kalemle işaretli. */
:root{
  --paper:#eef1f6; --card:#ffffff; --ink:#18223a; --muted:#5d6883; --line:#d5dbe8; --stage:#dfe6f7;
  --marker:#ffe14d; --marker-ink:#18223a; --accent:#2b4acb; --accent-d:#1d3391; --on-accent:#ffffff; --coin:#f5b400;
  --good:#12805a; --good-bg:#dff5ea; --bad:#b93838; --bad-bg:#fbe3e1;
  --display:"Zilla Slab",Georgia,serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#111624; --card:#1a2134; --ink:#e9ecf5; --muted:#98a2bd; --line:#2e3852; --stage:#232c47;
    --marker:#e6c62e; --marker-ink:#141a2b; --accent:#7d97ff; --accent-d:#4f68cf; --on-accent:#0f1424; --coin:#f5c531;
    --good:#5fd3a4; --good-bg:#16382d; --bad:#ff8f88; --bad-bg:#43201f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111624; --card:#1a2134; --ink:#e9ecf5; --muted:#98a2bd; --line:#2e3852; --stage:#232c47;
  --marker:#e6c62e; --marker-ink:#141a2b; --accent:#7d97ff; --accent-d:#4f68cf; --on-accent:#0f1424; --coin:#f5c531;
  --good:#5fd3a4; --good-bg:#16382d; --bad:#ff8f88; --bad-bg:#43201f; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 56px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-size:1.35rem;font-weight:700;margin:0}
.brand{display:flex;align-items:center;gap:9px}
.brand svg{width:32px;height:32px;border-radius:8px;flex:none}
.brand mark,.hello mark{background:var(--marker);color:var(--marker-ink);padding:0 .15em;border-radius:3px}
.coins{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 14px 5px 7px;font-weight:800;font-variant-numeric:tabular-nums}
.coin{width:20px;height:20px;border-radius:50%;background:var(--coin);border:2px solid rgba(0,0,0,.18);display:inline-block;flex:none}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px}
.tabs button{border:0;background:transparent;border-radius:8px;padding:9px 6px;font-weight:700;color:var(--muted)}
.tabs button[aria-current="page"]{background:var(--ink);color:var(--card)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-bottom:4px solid var(--accent-d);border-radius:12px;padding:12px 20px;font-weight:800}
.btn:active{border-bottom-width:1px;transform:translateY(3px)}
.btn.big{font-size:1.1rem;padding:15px 20px;width:100%}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-bottom-width:4px;font-weight:700}
.btn.small{padding:7px 12px;border-radius:9px;font-size:.88rem;border-bottom-width:3px}
.btn:disabled{opacity:.5;cursor:default}
.hint{color:var(--muted);font-size:.87rem;margin:0}
h2{font-size:1rem;margin:0}
/* ana ekran */
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.stage{background:var(--stage);border-radius:50%;width:150px;height:150px;flex:none;display:grid;place-items:center;overflow:hidden}
.stage svg{width:92%;height:auto;display:block;margin-top:8%}
.stage.lg{width:190px;height:190px;margin:0 auto}
.stage.sm{width:54px;height:54px}
.heroText{flex:1 1 220px;display:flex;flex-direction:column;gap:10px;min-width:0}
.bubble{background:var(--paper);border-radius:12px;padding:10px 14px;font-weight:600}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
.bar.thin{height:6px} .bar.thin i{background:var(--accent)}
.goalRow{display:flex;justify-content:space-between;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--paper);border-radius:12px;padding:10px 8px;text-align:center}
.tile b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums;line-height:1.2}
.tile span{font-size:.76rem;color:var(--muted)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:7px 14px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.rowb{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.sets div{font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
/* çalışma */
.steps{display:flex;gap:6px;flex-wrap:wrap;font-size:.76rem;font-weight:700}
.steps span{padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.steps span.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.steps span.done{color:var(--good);border-color:var(--good)}
.steps .tag{margin-left:auto;border-style:dashed}
.prompt{color:var(--muted);font-size:.95rem;margin:0}
.word{font-family:var(--display);font-size:2.3rem;font-weight:700;line-height:1.15;margin:0;overflow-wrap:anywhere}
.word.tr{font-family:var(--body);font-size:1.5rem}
.word mark,.sent mark,.ex mark{background:var(--marker);color:var(--marker-ink);padding:0 .18em;border-radius:3px}
.pos{font-family:var(--body);font-size:.85rem;font-weight:500;color:var(--muted);margin-left:8px}
.sent{font-family:var(--display);font-size:1.3rem;font-weight:500;margin:0}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.opts{grid-template-columns:1fr}.word{font-size:1.95rem}}
.opt{display:flex;gap:10px;align-items:center;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:12px 14px;min-height:54px;font-weight:600}
.opt kbd{font:700 .72rem var(--body);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--card)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.typing{display:flex;gap:10px;flex-wrap:wrap}
[hidden]{display:none!important}
.typing input,.field input{flex:1 1 180px;font-weight:600;font-size:1.05rem;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);min-width:0;width:100%}
.field input{flex:none}
.fb{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--good-bg)} .fb.no{background:var(--bad-bg)}
.fbHead{display:flex;align-items:center;gap:10px}
.fb h2{flex:1} .fb.ok h2{color:var(--good)} .fb.no h2{color:var(--bad)}
.gain{font-weight:800;display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.fb p{margin:0} .ex{font-family:var(--display);font-size:1.05rem}
/* mağaza */
.shopHead{display:flex;flex-direction:column;gap:12px;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);width:100%}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.item{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.item.worn{border-color:var(--good)}
.item svg{width:74px;height:56px}
.item b{font-size:.92rem}
.price{display:inline-flex;align-items:center;gap:5px}
.price .coin{width:14px;height:14px}
/* kelimeler */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-weight:700;font-size:.85rem;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.list{list-style:none;margin:0;padding:0;font-size:.92rem}
.list li{display:flex;gap:8px;align-items:baseline;border-bottom:1px solid var(--line);padding:7px 0;flex-wrap:wrap}
.list b{font-family:var(--display);font-size:1.05rem}
.list .m{color:var(--muted);flex:1 1 120px}
.pill{font-size:.7rem;font-weight:700;font-style:normal;border-radius:99px;padding:1px 8px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.l{color:var(--accent);border-color:var(--accent)} .pill.k{color:var(--good);border-color:var(--good)} .pill.h{color:var(--bad);border-color:var(--bad)}
.setHead{font-weight:800;font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:14px 0 2px;border:0!important}
details summary{cursor:pointer;font-weight:700}
.form{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 18px;border-radius:99px;font-weight:700;max-width:calc(100% - 32px);text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
.memo{margin:0;border-left:4px solid var(--marker);background:var(--paper);border-radius:0 10px 10px 0;padding:8px 12px;font-size:.95rem}
.hello{font-family:var(--display);font-size:1.7rem;font-weight:700;margin:0;line-height:1.15;text-wrap:balance}
.menuGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mi{text-align:left;background:var(--card);border:1.5px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.mi b{font-size:1rem} .mi span{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.mi.wide{grid-column:1/-1} .mi:disabled{opacity:.5;cursor:default}
.mi:hover:not(:disabled){border-color:var(--accent)} .mi:active:not(:disabled){border-bottom-width:1.5px;transform:translateY(2px)}
.petPick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.petPick button{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700}
.petPick button[aria-pressed="true"]{border-color:var(--accent);background:var(--stage)}
.petPick .stage{width:104px;height:104px;background:var(--card)}
input.good{border-color:var(--good)!important;background:var(--good-bg)!important}
/* harita: tek bir gece dünyası, temadan bağımsız */
.map{background:#15123a;border-radius:18px;overflow:hidden;border:1px solid #2e2a66}
.map svg{display:block;width:100%;height:auto}
.node{cursor:pointer;outline:none}
.node:hover .main,.node:focus-visible .main{stroke:#fff;stroke-width:5}
.node .halo{transition:opacity .2s} .node:hover .halo{opacity:.6}
@keyframes tw{50%{opacity:.15}} .tw{animation:tw 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}} .bob{animation:bob 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.tw,.bob{animation:none}}
#ptr{height:0;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:.85rem;font-weight:700;transition:height .15s;margin-bottom:-14px}
html,body{overscroll-behavior-y:contain}
.mean{font-size:1.45rem;font-weight:800;margin:0}
.intro p{margin:0}
.speak{border:1.5px solid var(--line);background:var(--paper);border-radius:99px;padding:3px 12px;font:700 .8rem var(--body);margin-left:10px;vertical-align:middle}
.opt.sel{border-color:var(--accent);background:var(--stage)}
.field select{font-weight:600;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);width:100%}
.score{font-size:3rem;font-weight:800;line-height:1;margin:0;font-variant-numeric:tabular-nums}
.miss{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.miss li{background:var(--paper);border-radius:10px;padding:9px 12px;font-size:.92rem}
.miss b{font-family:var(--display);font-size:1.05rem}
.miss .no{color:var(--bad)} .miss .ok{color:var(--good)}
.list li.w{display:block}
.list summary{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;cursor:pointer;font-weight:400;list-style:none}
.list summary::-webkit-details-marker{display:none}
.list .more{padding:6px 0 4px;color:var(--muted);font-size:.88rem;display:flex;flex-direction:column;gap:3px}
@media (prefers-reduced-motion:reduce){.bar i,.toast{transition:none}.btn:active{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <div id="ptr" aria-hidden="true"></div>
  <header class="top">
    <h1 class="brand"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"><defs><linearGradient id="icoSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#31248a"/><stop offset="1" stop-color="#120f33"/></linearGradient></defs><rect width="1024" height="1024" fill="url(#icoSky)"/><circle cx="512" cy="512" r="372" fill="#241b6b"/><circle cx="512" cy="512" r="372" fill="none" stroke="#ffd23f" stroke-width="46"/><path d="M512 468 C430 420 330 420 262 452 L262 742 C330 712 430 712 512 760 C594 712 694 712 762 742 L762 452 C694 420 594 420 512 468Z" fill="#f08a24"/><path d="M512 440 C436 396 344 396 284 424 L284 704 C344 676 436 676 512 722Z" fill="#ffffff"/><path d="M512 440 C588 396 680 396 740 424 L740 704 C680 676 588 676 512 722Z" fill="#ffe9b0"/><path d="M512 440 V722" stroke="#d9a400" stroke-width="10"/><path d="M330 498 C380 484 430 488 470 506" stroke="#ffc400" stroke-width="58" fill="none" stroke-linecap="round"/><g stroke="#c9cfe0" stroke-width="14" fill="none" stroke-linecap="round"><path d="M330 572 C380 558 430 562 470 580"/><path d="M330 636 C370 624 410 626 440 638"/></g><g stroke="#e3c98a" stroke-width="14" fill="none" stroke-linecap="round"><path d="M554 506 C594 488 644 484 694 498"/><path d="M554 580 C594 562 644 558 694 572"/><path d="M554 646 C590 630 630 626 664 634"/></g><polygon points="512.0,180.0 540.2,253.2 618.5,257.4 557.7,306.8 577.8,382.6 512.0,340.0 446.2,382.6 466.3,306.8 405.5,257.4 483.8,253.2" fill="#ffd23f" stroke="#241b6b" stroke-width="14" stroke-linejoin="round"/></svg><span>YDT <mark>Kelime</mark></span></h1>
    <div class="coins" title="Puanın"><span class="coin"></span><span id="coins">0</span></div>
  </header>
  <div id="backRow"><button class="btn ghost small" id="back" type="button">‹ Ana menü</button></div>
  <main id="view"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* kelime | tür | Türkçe (#gizli etiket: çeldirici seçerken benzer anlamlıları ayıklar) | eş anlam | zıt anlam | örnek cümle */
const RAW=`achieve|v|başarmak|accomplish|fail|She worked hard to ___ her goals.
abandon|v|terk etmek|give up||The villagers had to ___ their homes after the flood.
alter|v|değiştirmek|change||Nothing can ___ the fact that he lied.
assume|v|varsaymak|suppose||I ___ you have already eaten.
conceal|v|gizlemek, saklamak|hide|reveal|He tried to ___ the truth from his family.
decline|v|azalmak, düşmek|decrease|increase|Birth rates continue to ___ in Europe.
demonstrate|v|göstermek, kanıtlamak|show||The results ___ that the drug is effective.
emerge|v|ortaya çıkmak, belirmek|appear|disappear|New problems ___ every day.
expand|v|genişlemek, büyümek|enlarge|shrink|The company plans to ___ into Asia.
maintain|v|sürdürmek, muhafaza etmek|preserve||It is hard to ___ a healthy weight.
persuade|v|ikna etmek|convince||I tried to ___ him to see a doctor.
predict|v|tahmin etmek, kestirmek|forecast||Nobody can ___ when the next earthquake will happen.
prohibit|v|yasaklamak|forbid|allow|Many countries ___ smoking in public places.
reject|v|reddetmek|refuse|accept|The committee may ___ the proposal.
reveal|v|açığa çıkarmak, ifşa etmek|disclose|conceal|The study did not ___ any new information.
require|v|gerektirmek|need||Most jobs ___ computer skills.
affect|v|etkilemek|influence||Stress can ___ your sleep.
avoid|v|kaçınmak, sakınmak|stay away from||You should ___ sugary drinks.
provide|v|sağlamak, temin etmek|supply||The school will ___ free lunches for students.
support|v|desteklemek|back||Most parents ___ the new school rules.
occur|v|meydana gelmek, olmak|happen||Earthquakes ___ frequently in this region.
consider|v|düşünmek, göz önünde bulundurmak|think about||You should ___ all the options before deciding.
abundant|adj|bol, bereketli|plentiful|scarce|Fish are ___ in this lake.
accurate|adj|doğru, kesin|precise|inaccurate|The report gives an ___ picture of the economy.
adequate|adj|yeterli|sufficient|insufficient|The room lacks ___ lighting.
apparent|adj|açık, belli|obvious||It was ___ that she was upset.
beneficial|adj|yararlı, faydalı|advantageous|harmful|Regular exercise is ___ to health.
crucial|adj|hayati, çok önemli|vital|unimportant|Sleep is ___ for brain development.
diverse|adj|çeşitli, farklı|varied||Istanbul has a culturally ___ population.

/* ---------- çalışma mantığı ---------- */
let extraMode=false,sess={ok:0,wrong:0,learned:0,missed:new Set()};
function startPlay(m){mode=m;extraMode=false;sess={ok:0,wrong:0,learned:0,missed:new Set()};if(m==="normal")build();view="play";next();window.scrollTo(0,0)}
function endPlay(){go(sess.ok+sess.wrong>0?"sum":"menu")}
let view=(P.uid||P.guest)?(P.ob?"menu":"ob"):"auth",mode="normal",queue=[],count=0,cur=null,answered=false,lastHard=null;
function build(){
  const f=P.focus||0,L=shuffle(ALL.filter(x=>P.S[x.w]&&P.S[x.w].s<4)).sort((a,b)=>(P.S[b.w].debt||0)-(P.S[a.w].debt||0));
  const hot=L.filter(x=>P.S[x.w].debt>0),rest=L.filter(x=>!(P.S[x.w].debt>0));
  queue=hot.concat(f?rest.filter(x=>x.set===f):rest).slice(0,ACTIVE);refill();
}
const newLeft=()=>dueList().length>=15?0:Math.max(0,(P.newMax||15)+(P.day.bonus||0)-(P.day.newN||0)-queue.filter(x=>!P.S[x.w]).length);
function refill(){
  const inQ=new Set(queue.map(x=>x.w)),f=P.focus||0,un=x=>!P.S[x.w]&&!inQ.has(x.w);
  const lrn=shuffle(ALL.filter(x=>!inQ.has(x.w)&&P.S[x.w]&&P.S[x.w].s<4));
  const cand=(f?lrn.filter(x=>x.set===f).concat(shuffle(BASE.filter(x=>x.set===f&&un(x)))):[])
    .concat(lrn.filter(x=>!f||x.set!==f),ALL.filter(x=>x.custom&&un(x)));
  for(let s=1;s<=NSETS;s++)if(s!==f)cand.push(...shuffle(BASE.filter(x=>x.set===s&&un(x))));
  let allow=newLeft();
  while(queue.length<ACTIVE&&cand.length){const x=cand.shift();if(!P.S[x.w]){if(allow<=0)continue;allow--}queue.push(x)}
}
function qtype(it,step){
  if(step===0)return"tr";
  if(step===1)return it.syn?(it.ant&&Math.random()<.4?"ant":"syn"):"en";
  if(step===2)return it.ex?"cloze":"en";
  return"type";
}
// pekiştirme sorularında soru tipi her seferinde değişir ki şıkkın yeri değil kelime ezberlensin
function drillType(it,step){
  const ts=["tr","en"];if(step>=1&&it.syn)ts.push(it.ant&&Math.random()<.4?"ant":"syn");if(step>=2&&it.ex)ts.push("cloze");if(step>=3)ts.push("type");
  return rnd(ts);
}
function next(){
  answered=false;count++;ensureDay();
  if(mode==="hard"){
    const pool=hardList();
    if(!pool.length)cur=null;
    else{let it=rnd(pool);if(pool.length>1)while(it===lastHard)it=rnd(pool);lastHard=it;const step=Math.floor(Math.random()*4);cur={it,step,type:qtype(it,step),kind:"hard"}}
  }else{
    const due=dueList();
    if(due.length&&(queue.length===0||count%2===0)){const it=rnd(due),step=Math.floor(Math.random()*4);cur={it,step,type:qtype(it,step),kind:"review"}}
    else if(queue.length){const it=queue.shift(),S=P.S[it.w],step=S?S.s:0;
      cur=(!S||(!S.i&&S.s===0))?{it,step:0,type:"intro",kind:"learn"}:{it,step,type:S.debt>0?drillType(it,step):qtype(it,step),kind:"learn"}}
    else{const l=learned();if(extraMode&&l.length){const it=rnd(l),step=Math.floor(Math.random()*4);cur={it,step,type:qtype(it,step),kind:"extra"}}else cur=null}
  }
  render();
}
const FIELD={tr:"tr",syn:"syn",ant:"ant",cloze:"w",en:"w"};
function options(it,field){
  const ok=x=>x!==it&&x[field]&&x[field]!==it[field]&&![...x.tok].some(t=>it.tok.has(t));
  const pool=shuffle(ALL.filter(x=>ok(x)&&(!it.pos||x.pos===it.pos))).concat(shuffle(ALL.filter(x=>ok(x)&&it.pos&&x.pos!==it.pos)));
  const out=[it[field]];
  for(const x of pool){if(out.length===4)break;if(!out.includes(x[field]))out.push(x[field])}
  return shuffle(out);
}
function judge(ok,typed){
  answered=true;ensureDay();
  const{it,kind}=cur,s=P.S[it.w]||(P.S[it.w]={s:0,lv:0,due:0,x:0});s.i=1;
  const debt0=s.debt||0;let gain=0,note="";P.total++;
  if(ok){
    P.ok++;P.streak++;P.day.n++;sess.ok++;gain=(debt0>0?5:10)+(P.streak>=5?5:0);
    if(kind==="learn"){
      if(debt0>0){            // pekiştirme: adım ilerlemez, borç azalır
        s.debt=debt0-1;queue.splice(Math.min(s.debt?3:5,queue.length),0,it);
        note=s.debt?`Güzel. Üst üste ${s.debt+1} kez daha doğru bilirsen ilerleyecek.`:"Pekiştirme neredeyse tamam. Bir kez daha doğru bilirsen sıradaki adıma geçecek.";
      }else{
        s.s=cur.skip?3:cur.step+1;
        if(s.s>=4){s.s=4;s.lv=0;s.due=today()+IV[0];s.at=Date.now();gain+=25;sess.learned++;note="Bu kelimeyi öğrendin (+25). Yarın tekrar sorulacak.";refill()}
        else{queue.splice(Math.min(5,queue.length),0,it);note=cur.skip?"Biliyormuşsun. Son adım olarak yazma sorusu gelecek.":"Sıradaki adım birkaç soru sonra gelecek."}
      }
    }else if(kind==="review"){s.lv=Math.min(s.lv+1,IV.length-1);s.due=today()+IV[s.lv];s.at=Date.now();note=`Hâlâ aklında. Sonraki tekrar ${IV[s.lv]} gün sonra.`}
    else if(kind==="hard"){s.x=Math.max(0,s.x-1);note=s.x<2?"Bu kelime zorlandıkların listesinden çıktı.":"İyi gidiyor, biraz daha tekrar gerekiyor."}
    else note="Hâlâ aklında.";
    if(P.streak===5)note+=" Seri bonusu başladı: her doğruya +5.";
    if(!P.day.done&&P.day.n>=P.goal){P.day.done=true;P.streakDays++;P.lastGoal=today();const gb=P.goal*5;gain+=gb;toast(`Günlük hedef tamam! +${gb} puan`)}
    P.coins+=gain;P.score=(P.score||0)+gain;
  }else{
    P.streak=0;s.x++;sess.wrong++;sess.missed.add(it.w);
    if(kind==="hard")note="Bu kelime listede kalıyor, yine gelecek.";
    else{
      // öğrenme sırasında yanlış: bir adım geri. Öğrenilmiş kelime unutulduysa 2. adımdan yeniden.
      s.s=kind==="learn"?Math.max(0,cur.step-1):1;s.debt=2;
      queue=queue.filter(x=>x!==it);queue.splice(Math.min(1,queue.length),0,it);
      note=(kind==="learn"?"Bu kelime bir adım geri gitti.":"Bu kelimeyi unutmuşsun, yeniden çalışmaya alındı.")+" Üst üste 3 kez doğru bilene kadar sık sık soracağım.";
    }
    if(s.x>=3&&!P.notes[it.w])note+=` Bunu ${s.x} kez kaçırdın: aşağıya kendi çağrışımını yaz, daha kolay kalır.`;
  }
  save();$("coins").textContent=P.coins;goalBar();
  const tin=$("tin");if(tin){tin.disabled=true;$("dunno").disabled=true;$("check").disabled=true}
  const idk=$("idk");if(idk)idk.disabled=true;
  $("fb").innerHTML=`<div class="fb ${ok?"ok":"no"}"><div class="fbHead"><div class="stage sm">${petSVG(ok)}</div>
    <h2>${ok?"Doğru":"Yanlış"}${!ok&&typed?` · yazdığın: ${esc(typed)}`:""}</h2>${ok?`<span class="gain">+${gain}<span class="coin"></span></span>`:""}</div>
    <p><b>${esc(it.w)}</b> = ${esc(it.tr)}${it.syn?` · eş anlamlısı: <b>${esc(it.syn)}</b>`:""}${it.ant?` · zıt anlamlısı: <b>${esc(it.ant)}</b>`:""}</p>
    ${it.ex?`<p class="ex">${esc(it.ex).replace("___","<mark>"+esc(it.w)+"</mark>")}</p>`:""}${it.trx?`<p class="hint">${esc(it.trx)}</p>`:""}
    ${ok?"":`<label class="field">Devam etmek için kelimeyi bir kez kendin yaz<input id="fix" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${esc(it.w)}"></label>`}
    ${memoHtml(it,!ok)}
    <div class="rowb"><span class="hint">${note}</span><button class="btn" id="go" type="button" ${ok?"":"disabled"}>Devam</button></div></div>`;
  $("go").onclick=next;
  const fix=$("fix");
  if(fix){
    fix.oninput=()=>{const good=norm(fix.value)===norm(it.w);$("go").disabled=!good;fix.classList.toggle("good",good)};
    fix.onkeydown=e=>{if(e.key==="Enter"&&!$("go").disabled)next()};
    fix.focus();
  }else $("go").focus();
}
function pick(b){
  if(answered)return;
  const right=cur.it[FIELD[cur.type]],ok=b.dataset.v===right;
  document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.v===right)x.classList.add("right")});
  if(!ok)b.classList.add("wrong");
  judge(ok,"");
}

function qHead(it,type){
  const posTxt=it.pos?`<span class="pos">${POS[it.pos]}</span>`:"";
  if(type==="tr")return`<p class="prompt">Bu kelimenin Türkçe anlamı hangisi?</p><p class="word"><mark>${esc(it.w)}</mark>${posTxt}</p>`;
  if(type==="syn")return`<p class="prompt">Bu kelimenin eş anlamlısı hangisi?</p><p class="word"><mark>${esc(it.w)}</mark>${posTxt}</p>`;
  if(type==="ant")return`<p class="prompt">Bu kelimenin <b>zıt</b> anlamlısı hangisi?</p><p class="word"><mark>${esc(it.w)}</mark>${posTxt}</p>`;
  if(type==="cloze")return`<p class="prompt">Boşluğa hangi kelime gelir? İpucu: <b>${esc(it.tr)}</b></p><p class="sent">${esc(it.ex).replace("___",'<span class="blank">&nbsp;</span>')}</p>`;
  return`<p class="prompt">Bu anlama gelen İngilizce kelime hangisi?</p><p class="word tr">${esc(it.tr)}</p>`;
}

let T=null,tsrc="seen",tlen=20,tTimer=null;
const fmt=ms=>{const t=Math.max(0,Math.ceil(ms/1000));return Math.floor(t/60)+":"+String(t%60).padStart(2,"0")};
const netTxt=n=>(Math.round(n*100)/100).toString().replace(".",",");
function startTest(){
  const pool=tsrc==="seen"?ALL.filter(x=>P.S[x.w]):tsrc==="all"?ALL.slice():BASE.filter(x=>x.set===+tsrc);
  if(pool.length<4){toast("Burada henüz yeterli kelime yok. Önce biraz çalış ya da başka bir kaynak seç.");return}
  const qs=shuffle(pool).slice(0,tlen).map(it=>{const ts=["tr","en"];if(it.syn)ts.push("syn");if(it.ant)ts.push("ant");if(it.ex)ts.push("cloze");
    const type=rnd(ts);return{it,type,opts:options(it,FIELD[type]),ans:null}});
  T={qs,i:0,start:Date.now(),end:Date.now()+qs.length*30000,done:false};
  clearInterval(tTimer);
  tTimer=setInterval(()=>{if(view!=="test"||!T||T.done){clearInterval(tTimer);return}
    const left=T.end-Date.now();if(left<=0){finishTest();return}const e=$("tclock");if(e)e.textContent=fmt(left)},500);
  go("test");
}
function finishTest(){
  clearInterval(tTimer);const n=T.qs.length;let ok=0,wrong=0;
  for(const q of T.qs){if(q.ans===null)continue;q.ans===q.it[FIELD[q.type]]?ok++:wrong++}
  Object.assign(T,{done:true,time:Math.min(Date.now(),T.end)-T.start,ok,wrong,blank:n-ok-wrong,net:ok-wrong/4});
  T.gain=ok*5+(T.net>=n*.9?50:0);P.coins+=T.gain;P.score=(P.score||0)+T.gain;
  P.tests=(P.tests||[]).concat({d:today(),n,ok,wrong,net:T.net}).slice(-10);save();
  if(view==="test"){render();window.scrollTo(0,0)}
}
function rTest(){

    <p class="hint">Cevaplar test bitince gösterilir. Seçtiğin şıkka tekrar dokunursan soruyu boş bırakırsın.</p></section></div>`;
  $("tquit").onclick=()=>{clearInterval(tTimer);T=null;go("menu")};

}

  <section class="card"><div class="chips">${chips.map(([k,t])=>`<button type="button" data-f="${k}" aria-pressed="${wf===k}">${t}</button>`).join("")}</div>
    <label class="field">Ara<input id="wq" type="search" value="${esc(wq)}" placeholder="Kelime ya da anlam" autocomplete="off"></label>
    <p class="hint">Bir kelimeye dokununca eş anlamlısı ve örnek cümlesi açılır.</p><ul class="list" id="wlist"></ul></section>
  <section class="card"><div class="rowb"><span class="hint">İlerleme, puanlar ve kıyafetler bu tarayıcıda saklanır.</span><button class="btn ghost small" id="reset" type="button">Her şeyi sıfırla</button></div></section></div>`;
  const draw=()=>{
    const q=wq.toLocaleLowerCase("tr");
    const ws=ALL.filter(x=>{const s=P.S[x.w];
      if(wf==="hard"&&!(s&&s.x>=2))return false;if(wf==="known"&&!(s&&s.s===4))return false;if(wf==="mine"&&!x.custom)return false;
      return!q||x.w.toLowerCase().includes(q)||x.tr.toLocaleLowerCase("tr").includes(q)});
    if(wf==="hard")ws.sort((a,b)=>P.S[b.w].x-P.S[a.w].x);
    let h="",last=null;
    for(const x of ws){
      if(wf==="all"&&!q&&x.set!==last){last=x.set;h+=`<li class="setHead">${x.set?setName(x.set):"Benim eklediklerim"}</li>`}
      h+=`<li class="w"><details><summary><b>${esc(x.w)}</b><span class="m">${esc(x.tr)}</span>${pill(x)}</summary><div class="more">
        ${x.syn?`<span>Eş anlamlısı: <b>${esc(x.syn)}</b></span>`:""}${x.ant?`<span>Zıt anlamlısı: <b>${esc(x.ant)}</b></span>`:""}
        ${x.ex?`<span class="ex">${esc(x.ex).replace("___","<mark>"+esc(x.w)+"</mark>")}</span>`:""}${x.trx?`<span>${esc(x.trx)}</span>`:""}${memoHtml(x,true)}
        ${x.custom?`<span><button class="btn ghost small" type="button" data-del="${esc(x.w)}">Sil</button></span>`:""}</div></details></li>`;
    }
    $("wlist").innerHTML=h||'<li class="m">Burada henüz kelime yok.</li>';
    document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{P.custom=P.custom.filter(c=>c.w!==b.dataset.del);delete P.S[b.dataset.del];save();rebuildAll();draw()});
  };
  draw();
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{wf=b.dataset.f;rWords()});
  $("wq").oninput=e=>{wq=e.target.value;draw()};
  $("addForm").onsubmit=e=>{
    e.preventDefault();
    const w=$("aw").value.trim().toLowerCase(),tr=$("at").value.trim(),syn=$("as").value.trim();let ex=$("ae").value.trim();
    if(!w||!tr)return;
    if(ALL.some(x=>norm(x.w)===norm(w))){toast("Bu kelime listede zaten var");return}
    if(ex&&!ex.includes("___")){const i=ex.toLowerCase().indexOf(w);ex=i>=0?ex.slice(0,i)+"___"+ex.slice(i+w.length):""}
    P.custom.unshift({w,tr,syn,ex});save();rebuildAll();toast(w+" eklendi");wf="mine";rWords();$("addBox").open=true;
  };
  let armed=false;
  $("reset").onclick=function(){
    if(!armed){armed=true;this.textContent="Emin misin? Tekrar dokun";setTimeout(()=>{armed=false;if(this.isConnected)this.textContent="Her şeyi sıfırla"},4000);return}
    const keep={uid:P.uid,username:P.username,code:P.code,guest:P.guest};P=Object.assign(fresh(),keep);save();rebuildAll();queue=[];count=0;toast("Sıfırlandı");go("ob");
  };
}
$("back").onclick=()=>go("menu");
/* ---- aşağı çekince yenile (çalışma, test ve düello sırasında kapalı) ---- */
async function refreshNow(){
  if(fbUser){friends=null;await Promise.all([syncDown().catch(()=>{}),claimGifts().catch(()=>{}),loadDuels().then(l=>{duels=l}).catch(()=>{})])}
  render();toast(fbUser?"Güncellendi":"Güncellendi (hesapsız: yalnızca bu cihaz)");
}
let ptrY=null,ptrD=0,ptrBusy=false;
addEventListener("touchstart",e=>{ptrD=0;ptrY=(!ptrBusy&&window.scrollY<=0&&!["play","test","duel","auth","ob"].includes(view))?e.touches[0].clientY:null},{passive:true});
addEventListener("touchmove",e=>{if(ptrY===null)return;ptrD=e.touches[0].clientY-ptrY;const el=$("ptr");
  if(ptrD>14){el.style.height=Math.min(60,ptrD*.45)+"px";el.textContent=ptrD>120?"Bırak, yenilensin":"Yenilemek için çek"}else el.style.height="0"},{passive:true});
addEventListener("touchend",()=>{if(ptrY===null)return;const el=$("ptr"),fire=ptrD>120;ptrY=null;
  if(!fire){el.style.height="0";return}
  ptrBusy=true;el.textContent="Yenileniyor…";refreshNow().catch(()=>{}).then(()=>{ptrBusy=false;el.style.height="0"})});
document.addEventListener("input",e=>{const w=e.target.dataset&&e.target.dataset.note;if(!w)return;const v=e.target.value.trim();if(v)P.notes[w]=v;else delete P.notes[w];save()});
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT")return;
  if(view==="test"&&T&&!T.done&&e.key>="1"&&e.key<="4"){const b=document.querySelectorAll(".opt")[+e.key-1];if(b)b.click();return}
  if(view!=="play")return;
  if(!answered&&cur&&cur.type!=="type"&&e.key>="1"&&e.key<="4"){const b=document.querySelectorAll(".opt")[+e.key-1];if(b)pick(b)}
});
rebuildAll();normalize();ensureDay();render();fbInit();
</script>
</body>
